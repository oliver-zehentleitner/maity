name: ci

# The changelog fragments; the dashboard's checks and smoke test; the hub's
# checks: lint, types and tests on SQLite; the test suite against PostgreSQL
# and MariaDB; the built wheel on Python 3.13; the image; the Helm chart.
# Every hub job installs the locked set from hub/requirements/, and hub-lock
# checks the locks follow pyproject.toml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its run still in the queue or running;
# main keeps one run per merge (its group is the commit), never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: hub

# The three database jobs may run on the maintainer's own machine (deploy/runner/): the
# repository variable HUB_RUNNER holds the labels as JSON, e.g. ["self-hosted","maity-hub"].
# Unset or empty, and for every pull request from a fork, they run on GitHub-hosted
# runners; unsetting the variable is the whole fallback.
jobs:
  # Which parts a pull request touches, from its merge commit against the base it
  # merges into: a suite runs only when its part changed. A push to main, or a
  # change to this workflow, runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.paths.outputs.hub }}
      image: ${{ steps.paths.outputs.image }}
      join: ${{ steps.paths.outputs.join }}
      web: ${{ steps.paths.outputs.web }}
      e2e: ${{ steps.paths.outputs.e2e }}
      cli: ${{ steps.paths.outputs.cli }}
      helm: ${{ steps.paths.outputs.helm }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          parts="hub image join web e2e cli helm"
          if [ "$EVENT" != pull_request ]; then
            for part in $parts; do echo "$part=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          for part in $parts; do
            hit=false
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$part:$file" in
                *:.github/workflows/ci.yml) hit=true ;;
                hub:hub/*|hub:docs/join-page.md) hit=true ;;
                image:hub/*|image:docs/join-page.md|image:deploy/Dockerfile*) hit=true ;;
                join:hub/*|join:cli/*|join:docs/join-page.md) hit=true ;;
                web:web/*) hit=true ;;
                e2e:web/*|e2e:hub/*|e2e:cli/*|e2e:docs/join-page.md) hit=true ;;
                cli:cli/*) hit=true ;;
                helm:deploy/*) hit=true ;;
              esac
            done <<< "$changed"
            echo "$part=$hit" >> "$GITHUB_OUTPUT"
          done

  # The changelog fragments in changelog.d/ (one per pull request, folded into
  # CHANGELOG.md at release) and the tool's own tests; standard library only,
  # on the oldest Python the tool supports.
  changelog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python tools/changelog.py check
      - run: python -m unittest discover -s tools -p 'test_*.py' -v

  # The dashboard (web/, owned by Agent D): structure checks on the Python
  # standard library, the behaviour smoke test on the runner's node binary.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 --version && node --version
      - run: make check
      - run: make smoke

  # The dashboard in headless Chromium against a real hub on SQLite, with the
  # maity CLI as the agent (web/tools/e2e.py). The screenshots of every step
  # and the hub's log are uploaded, also when a step fails.
  web-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e hub -e cli playwright==1.64.0
      # The Runners view's starter configurations, as the page writes them,
      # through the runner's own `maity runner check` (Python 3.11+).
      - run: python web/tools/starter_configs.py
      # The headless shell only, and from apt only the libraries it lacks on
      # the runner; `--with-deps` installed 9 and upgraded 8 packages and took
      # 52 s to 5 min, mostly apt. A library still missing afterwards fails
      # here, before the test.
      - run: python -m playwright install --only-shell chromium
      # bash: -e and pipefail, so a failing ls or ldd fails the step.
      - shell: bash
        run: |
          shell="$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)"
          test -x "$shell"
          ldd "$shell" >/dev/null
          missing="$(ldd "$shell" | awk '/not found/ {print $1}' | tr '\n' ' ')"
          echo "missing before: ${missing:-none}"
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libnss3 libnspr4 libasound2t64
          fi
          if ldd "$shell" | grep "not found"; then exit 1; fi
      - run: python web/tools/e2e.py --artifacts e2e-screenshots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  hub-sqlite:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ${{ (vars.HUB_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.HUB_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make check

  # What ships: the wheel, installed non-editable, so a file missing from it
  # (a migration, help.md) fails here. Python 3.13 backs "3.12 or newer". Only the
  # tests marked `wheel` run: the package data, the entry point and the migrations
  # the wheel carries. The whole suite runs in hub-sqlite on the checkout.
  hub-wheel:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
      - run: pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: pip install --no-deps "$(ls dist/*.whl)"
      - run: rm -rf src && pytest -m wheel

  # The locks in hub/requirements/ follow pyproject.toml: recompiled with the
  # pinned uv, they must come out unchanged (`make lock` was run).
  hub-lock:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/tools.txt
      - run: make lock-check

  hub-image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t maity-hub:ci .
      - run: docker run --rm maity-hub:ci --version
      - run: docker run --rm maity-hub:ci migrate
      - run: docker run --rm -e MAITY_DATABASE_URL=sqlite:////tmp/t.db maity-hub:ci migrate

  # The Helm chart: lint, every rendered configuration and refusal without a
  # cluster, then install, helm test, a login, an upgrade and a refused
  # upgrade on a throwaway kind cluster. helm, kind and kubectl come with the
  # runner image; the first step prints their versions.
  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm version --short && kind version && kubectl version --client
      - run: deploy/helm/check.sh
      - run: deploy/helm/kind-smoke.sh

  # The paste line end to end, both ways a joining agent can take it (docs/api.md §3):
  # plain curl as the join page says, and the maity CLI.
  join-smoke:
    needs: changes
    if: needs.changes.outputs.join == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r hub/requirements/runtime.txt -r hub/requirements/build.txt
      - run: pip install --no-deps --no-build-isolation -e hub
      - run: pip install -e cli
      - run: hub/scripts/smoke_join.sh

  hub-postgresql:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ${{ (vars.HUB_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.HUB_RUNNER) || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maity
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: maity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maity" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      MAITY_TEST_DATABASE_URL: postgresql://maity:ci-only@127.0.0.1:5432/maity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make test

  hub-mariadb:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ${{ (vars.HUB_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.HUB_RUNNER) || 'ubuntu-latest' }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: maity
          MARIADB_PASSWORD: ci-only
          MARIADB_DATABASE: maity
          MARIADB_ROOT_PASSWORD: ci-only  # the test workers create their own databases
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      MAITY_TEST_DATABASE_URL: mariadb://maity:ci-only@127.0.0.1:3306/maity
      MAITY_TEST_ADMIN_DATABASE_URL: mariadb://root:ci-only@127.0.0.1:3306/maity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make test

  # The agent-side command: lint, types and tests on the oldest and the newest
  # Python it supports. Standard library only, so nothing else is installed.
  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: make check

  # The one check to require: green when every suite either passed or was not
  # needed (skipped by `changes`), red when one failed or was cancelled.
  ci-ok:
    if: always()
    needs: [changes, changelog, web, web-e2e, hub-sqlite, hub-wheel, hub-lock, hub-image, helm, join-smoke, hub-postgresql, hub-mariadb, cli]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .  # no checkout here, so the workflow's hub/ does not exist
    steps:
      - shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
