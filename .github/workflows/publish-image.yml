name: publish-image

# The hub image, built from deploy/Dockerfile and pushed to
# ghcr.io/oliver-zehentleitner/maity-hub: on a v* tag, or by hand from any ref
# (workflow_dispatch). Nothing else triggers it, so merging this file pushes
# nothing. Before the push, the same build is loaded and checked: it starts,
# migrates an empty SQLite database, and on a tag it reports the tag's version.
# The push carries an SBOM and SLSA provenance as attestations.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; the one job below asks for what it needs.
permissions: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the push to ghcr.io; no other job in this repository has it
    env:
      IMAGE: ghcr.io/oliver-zehentleitner/maity-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: the version on a v* tag (1.2.3 and 1.2), always the full commit SHA,
      # never `latest` (deploy/helm/maity-hub/values.yaml: a moving tag does not
      # change the pod on an upgrade).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: maity-hub:check
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Check the image before it is pushed
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm maity-hub:check --version)"
          echo "$reported"
          docker run --rm maity-hub:check migrate
          if [ "$REF_TYPE" = tag ]; then
            # A tag v1.2.3 must hold hub 1.2.3: the image is named after what it runs.
            [ "$reported" = "maity-hub ${REF_NAME#v}" ] || {
              echo "::error::tag $REF_NAME but the image reports '$reported'"
              exit 1
            }
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Pushed \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "For the chart: \`image.repository: ${IMAGE}\`, \`image.digest: ${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
