name: publish-image

# The hub image, built from deploy/Dockerfile and pushed to
# ghcr.io/oliver-zehentleitner/maity-hub: on a v* tag, or by hand from main
# (workflow_dispatch). This file's `if` stops a run from any other ref before it
# builds, and its environment `ghcr` is open only to main and v* tags (the
# repository's environment settings). Both live in this file, which a branch can
# change; what an operator relies on is the signature, whose certificate names
# the ref, and the repository's rules on who may create v* tags.
# Before the push, the same build is loaded and checked: it starts, migrates an
# empty SQLite database, and on a tag it reports the tag's version. The push
# carries an SBOM and SLSA provenance as attestations. A second job signs the
# pushed digest with cosign, keyless: the certificate names this workflow and the
# ref it ran on, which is what an operator checks (deploy/helm/maity-hub/README.md);
# only that job may request an OIDC token.
# On a tag, the `gate` job first asks what release-hub.yml asks before the
# package: ci passed on the tagged commit and hub-mariadb on the same hub files
# (tools/release_gate.py, read-only). A tag without them builds nothing. A hand
# start from main is not gated: it is the maintainer's own build of main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job below asks for what it needs.
permissions: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On a v* tag, the release's standard before anything is built: ci-ok of the
  # push to main for the commit, hub-mariadb on the same hub files.
  gate:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # ci takes about an hour, hub-mariadb about 40 minutes and may queue behind
    # another run: the wait covers a tag pushed right after its merge.
    timeout-minutes: 240
    permissions:
      actions: read # the runs of ci and hub-mariadb
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits hub-mariadb tested, to compare their hub files
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_gate.py --sha "$GITHUB_SHA" --mariadb --wait-minutes 230

  image:
    needs: gate
    # Only a v* tag that passed the gate, or main (the gate skipped); a dispatch
    # from another branch does nothing.
    if: >-
      always() &&
      ((github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.gate.result == 'success') ||
      (github.ref == 'refs/heads/main' && needs.gate.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read
      packages: write # the push to ghcr.io; only this workflow's jobs have it
    env:
      IMAGE: ghcr.io/oliver-zehentleitner/maity-hub
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: the version on a v* tag as pyproject.toml writes it (0.1.0a2, 1.2.3),
      # 1.2 for a final release, always the full commit SHA, never `latest`
      # (deploy/helm/maity-hub/values.yaml: a moving tag does not change the pod on
      # an upgrade). The version comes from `match`, not `semver`: the hub's
      # versions are PEP 440, and `type=semver` drops 0.1.0a2 as invalid SemVer, so
      # v0.1.0a1 got only its SHA tag. The chart's appVersion names this tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=^v(\d+\.\d+\.\d+((a|b|rc)\d+)?)$,group=1
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: maity-hub:check
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Check the image before it is pushed
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          reported="$(docker run --rm maity-hub:check --version)"
          echo "$reported"
          docker run --rm maity-hub:check migrate
          if [ "$REF_TYPE" = tag ]; then
            # A tag v1.2.3 must hold hub 1.2.3: the image is named after what it runs.
            [ "$reported" = "maity-hub ${REF_NAME#v}" ] || {
              echo "::error::tag $REF_NAME but the image reports '$reported'"
              exit 1
            }
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Pushed \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "For the chart: \`image.repository: ${IMAGE}\`, \`image.digest: ${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The signature in a job of its own: the OIDC token is for cosign alone, not for
  # the build steps and the image run above.
  sign:
    needs: image
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      packages: write # the signature is stored next to the image
      id-token: write # the keyless signature: the OIDC identity cosign's certificate names
    env:
      IMAGE: ghcr.io/oliver-zehentleitner/maity-hub
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # The digest, never a tag: a tag can be moved, the signature is for these bytes.
      - name: Sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        run: echo "Signed \`${IMAGE}@${DIGEST}\` as \`${GITHUB_WORKFLOW_REF}\`." >> "$GITHUB_STEP_SUMMARY"
