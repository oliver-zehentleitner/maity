name: pages

# The project site at maity.dev (plain files from docs/, no build, with a sitemap.xml and
# a robots.txt made at deploy) and the Keep the Why dashboard at /keep-the-why-dashboard/
# on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the dashboard dates entries by Git history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Keep the Why: index.html, state.json and the live badges
      # (badge-entries.svg, badge-entries-flat.svg), exported from this checkout.
      # The root and every child project (hub, cli, web) get their own export;
      # each child's .keep-the-why names its export in dashboard-state, which is
      # how the family resolves in public mode. A child without context/ yet is
      # skipped.
      - run: |
          mkdir -p site
          cp -r docs/. site/
          # The brand files have one home, web/brand/; the site links them from brand/.
          cp -r web/brand site/brand
          pip install --quiet keep-the-why-dashboard
          ktw-dashboard --export site/keep-the-why-dashboard .
          for d in hub cli web; do
            if [ -d "$d/context" ]; then
              ktw-dashboard "$d" --export "site/keep-the-why-dashboard/$d"
            fi
          done
      # sitemap.xml from the pages above (not the dashboard's entries, not the brand files)
      # and a robots.txt that names it, for the search engines' consoles.
      - run: python tools/site_sitemap.py site --docs docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
