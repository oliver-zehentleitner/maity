[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maity-hub"
version = "0.1.0a1"
description = "The Maity hub: the server humans and their coding agents join"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",  # the worker threads' limiter, for the `stats` line
    "fastapi>=0.156",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "markdown-it-py>=3.0",
    "pillow>=13.0,<14",  # avatars: decoded and re-encoded (docs/api.md §6.10)
    "cryptography>=50.0.2,<51",  # AES-256-GCM for stored secrets (docs/api.md §16.2, §17.4)
    "boto3>=1.40,<2",  # the `s3` attachment store (docs/api.md §8.7, hub/context/replicas.md)
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-xdist>=3.6",  # CI runs the suite in parallel; each worker has its own database
    "httpx2>=2.16",
    "starlette>=1.2",  # the TestClient on httpx2
    # A local S3 for the `s3` store's tests, on loopback: the S3 backend and the server's
    # own two packages, not `moto[server]`, which brings every service's dependencies.
    "moto[s3]>=5.1",
    "flask>=3.1",
    "flask-cors>=6.0",
]

[project.scripts]
maity-hub = "maity_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maity_hub"]

# The join page (docs/) and the dashboard (web/) ride along as maity_hub/join-page.md
# and maity_hub/web, so an installed hub serves them too: hatch_build.py takes them
# from the checkout, or from an sdist's bundled/ copy.
[tool.hatch.build.hooks.custom]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "hatch_build.py"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pymysql.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The load tests (tests/test_load.py) run in CI's hub-load job: `pytest -m load`.
addopts = "-m 'not load'"
# A passing test's tmp_path is removed. The default "all" kept one copy of
# the template database per test (hub/context/testing.md).
tmp_path_retention_policy = "failed"
markers = [
    "load: the notifications' cost does not grow with history or tabs (CI's hub-load job runs only these, on PostgreSQL)",
    "wheel: what the installed wheel has to prove (CI's hub-wheel job runs only these): the package data, the entry point and the migrations it carries",
]
