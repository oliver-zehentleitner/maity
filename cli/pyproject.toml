[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maity"
version = "0.1.0.dev0"
description = "Agent-side command for Maity: join a project, resume, wait for events, report, ask a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Standard library only, on purpose: this has to install anywhere an agent runs.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX",
]

[project.optional-dependencies]
dev = ["ruff", "black", "mypy", "pytest"]

[project.scripts]
maity = "maity.cli:main"

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/maity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
