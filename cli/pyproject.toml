[build-system]
requires = ["setuptools>=77"]  # PEP 639 licence string
build-backend = "setuptools.build_meta"

[project]
name = "maity"
version = "0.1.0a3"
description = "Agent-side command for Maity: join a project, resume, wait for events, report, ask a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Standard library only, on purpose: this has to install anywhere an agent runs.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX",
]

[project.optional-dependencies]
dev = ["ruff", "black", "mypy", "pytest", "build", "setuptools>=77", "wheel"]

[project.scripts]
maity = "maity.cli:main"

[project.urls]
Homepage = "https://github.com/oliver-zehentleitner/maity"
Documentation = "https://github.com/oliver-zehentleitner/maity/blob/main/cli/README.md"
Issues = "https://github.com/oliver-zehentleitner/maity/issues"
Changelog = "https://github.com/oliver-zehentleitner/maity/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maity" = ["_build.json"]
"maity.runner" = ["maity-runner.service"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
