# The hub with PostgreSQL, for a local run:
#   MAITY_DB_PASSWORD=<choose one> docker compose -f deploy/docker-compose.yml up --build
# Migrations run in their own one-shot service before the hub starts; the hub
# itself never migrates.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maity
      POSTGRES_DB: maity
      POSTGRES_PASSWORD: ${MAITY_DB_PASSWORD:?set MAITY_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maity", "-d", "maity"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maity-hub:local
    command: ["migrate"]
    environment: &hub-env
      MAITY_DATABASE_URL: postgresql://maity:${MAITY_DB_PASSWORD:?set MAITY_DB_PASSWORD}@db/maity
      MAITY_PUBLIC_URL: ${MAITY_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  hub:
    image: maity-hub:local
    environment: *hub-env
    ports:
      - "${MAITY_PUBLISH:-127.0.0.1:8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
