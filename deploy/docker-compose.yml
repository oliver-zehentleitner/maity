# The hub with PostgreSQL, for a local run. Put the three database passwords
# into deploy/.env (never committed, made with umask 077, never on a command
# line) and start from the repository root:
#   (umask 077; for v in MAITY_DB_PASSWORD MAITY_DB_OWNER_PASSWORD MAITY_DB_APP_PASSWORD; do
#      printf '%s=%s\n' "$v" "$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"; done > deploy/.env)
#   docker compose -f deploy/docker-compose.yml up --build
# The passwords: letters, digits and - _ . ~ only, nothing else. The same value
# reaches PostgreSQL as it is and the hub inside a URL, so a character that
# needs percent-encoding cannot work for both; Compose also interpolates `$`.
# Three database roles (docs/install/README.md, "Database roles"): `maity`, the
# superuser, for admin work and dumps; `maity_owner`, which owns the schema and
# runs the migrations; `maity_app`, the hub's, which only reads and writes rows.
# A new volume gets the two roles from postgres-roles.sql on its first start; a
# volume from before them gets them by the upgrade step in the same section.
# Migrations run in their own one-shot service before the hub starts; the hub
# itself never migrates.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maity
      POSTGRES_DB: maity
      POSTGRES_PASSWORD: ${MAITY_DB_PASSWORD:?set MAITY_DB_PASSWORD in deploy/.env}
      # Read only by postgres-init-roles.sh, on the volume's first start.
      MAITY_DB_OWNER_PASSWORD: ${MAITY_DB_OWNER_PASSWORD:?set MAITY_DB_OWNER_PASSWORD in deploy/.env}
      MAITY_DB_APP_PASSWORD: ${MAITY_DB_APP_PASSWORD:?set MAITY_DB_APP_PASSWORD in deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
      - ./postgres-roles.sql:/maity/postgres-roles.sql:ro
      - ./postgres-init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maity", "-d", "maity"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: maity-hub:local
    command: ["migrate"]
    environment:
      <<: &hub-env
        # The address browsers and agents use; change it together with MAITY_PUBLISH.
        MAITY_PUBLIC_URL: ${MAITY_PUBLIC_URL:-http://localhost:8080}
        # The port is published on loopback only, but the hub sees the Docker bridge
        # as its peer: plain HTTP must be allowed explicitly (docs/api.md §2.5).
        # Remove this once the hub is published on a network behind TLS.
        MAITY_ALLOW_PLAIN_HTTP: "1"
      # The migrations as the role that owns the schema.
      MAITY_DATABASE_URL: postgresql://maity_owner:${MAITY_DB_OWNER_PASSWORD:?set MAITY_DB_OWNER_PASSWORD in deploy/.env}@db/maity
    depends_on:
      db:
        condition: service_healthy

  hub:
    image: maity-hub:local
    environment:
      <<: *hub-env
      # The hub as the role that only reads and writes rows.
      MAITY_DATABASE_URL: postgresql://maity_app:${MAITY_DB_APP_PASSWORD:?set MAITY_DB_APP_PASSWORD in deploy/.env}@db/maity
    ports:
      - "${MAITY_PUBLISH:-127.0.0.1:8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db:
