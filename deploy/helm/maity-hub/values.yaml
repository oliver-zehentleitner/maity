# The Maity hub on Kubernetes: one Deployment with one pod, a Service, an
# optional Ingress, a NetworkPolicy, and `maity-hub migrate` as a Job before
# every install and upgrade. PostgreSQL is not part of the chart; the hub
# connects to one that exists. Secrets are never values here: the chart only
# names Secrets that already exist in the release namespace.
#
# What every install sets: image.repository, database.existingSecret, and
# either the Ingress (ingress.enabled, ingress.host, ingress.className,
# config.trustedProxies) or config.publicUrl. README.md walks through a
# complete install.

image:
  # Required. ghcr.io/oliver-zehentleitner/maity-hub once releases are published
  # (workflow publish-image), or your own build of deploy/Dockerfile.
  repository: ""
  # Empty: the chart's appVersion. Use an immutable tag (a release or a full
  # commit SHA), never `latest`: the pod would not change on an upgrade.
  tag: ""
  # `sha256:…`; when set it wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent

# Existing docker-registry Secrets for a private registry, as
#   - name: registry-credentials
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

config:
  # MAITY_PUBLIC_URL: the address browsers and agents use; it appears in join
  # links and in /help. Empty: https://<ingress.host> with the Ingress enabled
  # (also with ingress.tls.enabled false, which then needs TLS in front of the
  # controller, e.g. on the load balancer); required without the Ingress.
  publicUrl: ""
  # MAITY_TRUSTED_PROXIES: comma-separated addresses or CIDRs of the proxies in
  # front of the hub, i.e. the ingress controller's pods. The hub takes the
  # client address and the scheme from X-Forwarded-* only when the connection
  # comes from one of them. Required with the Ingress enabled. The cluster's
  # pod network is the usual value:
  #   kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
  # lists each node's share of it. The controller must see the real client
  # address itself for this to help: behind a cloud load balancer that is
  # PROXY protocol or `externalTrafficPolicy: Local` on the controller's
  # Service (README.md, "Client addresses"); otherwise every client shares
  # one address and one rate-limit bucket.
  trustedProxies: ""
  # MAITY_ALLOW_PLAIN_HTTP: bearer credentials and cookies over plain HTTP.
  # Only for a hub nothing outside the cluster reaches: refused with the
  # Ingress enabled or a Service type other than ClusterIP.
  allowPlainHttp: false
  # Serve the dashboard from the image's web/ (MAITY_WEB_DIR=/app/web). Off:
  # API only.
  dashboard: true

database:
  # Required. The name of a Secret in the release namespace whose `key` holds
  # MAITY_DATABASE_URL, e.g. for a managed PostgreSQL with TLS:
  #   postgresql://maity:<password>@db.example.org:16751/maity?sslmode=require
  # Percent-encode an `@` or `:` in the password. README.md shows how to create
  # it without the URL entering the shell history, and how to mount the
  # database's CA for sslmode=verify-full.
  existingSecret: ""
  key: database-url

forge:
  github:
    # Optional. The name of a Secret whose `key` holds a GitHub token for the
    # forge probe (MAITY_FORGE_GITHUB_TOKEN; read access to pull requests,
    # contents and checks is enough). May be the same Secret as the database's.
    # The probe and release readiness come with a later hub version; until
    # then the token is read and unused.
    existingSecret: ""
    key: github-token

secretKey:
  # The instance key for secrets the hub stores at rest (MAITY_SECRET_KEY: 32 random bytes, base64; docs/api.md §16.2, §17.4):
  # the forge webhook's secret, stored SMTP passwords, second-factor secrets. It comes from a Secret that already exists in the
  # release namespace, and its value never passes through the chart. Empty: none is set, and the features that need it refuse
  # (`secret_key_missing`). Keep a copy outside the cluster: a new key leaves everything sealed with the old one unreadable.
  # When you move it here from `extraEnv`, drop it from `extraEnv` in the same upgrade (the chart renders both; the later wins).
  existingSecret: ""
  key: secret-key

mail:
  # The instance's outgoing mail (docs/api.md §16.2). Nothing is rendered until a value is set: without
  # `signingKeySecret` the hub sends no mail at all, and the settings below only take effect with it.
  # The environment wins over the admin settings (`set_by_environment`).
  #
  # The signing key (MAITY_MAIL_SIGNING_KEY: 32 bytes or more, base64) signs the links in mails. It
  # comes from a Secret that already exists in the release namespace, and its value never passes
  # through the chart. Keep a copy: a new key makes every mailed link that is still out invalid.
  signingKeySecret:
    existingSecret: ""
    key: mail-signing-key
  # The SMTP server (MAITY_SMTP_*). Empty host: none of these is set, and the admin settings apply. With a host, port and
  # tls always come from here (the defaults below included) and win over the admin settings (§16.2 `set_by_environment`).
  # When you move these variables here from `extraEnv`, drop them from `extraEnv` in the same upgrade: the chart renders both,
  # the names would appear twice in the container env, and the later one (`extraEnv`) wins.
  host: ""
  port: 587
  # starttls, implicit or none (none only for a loopback host).
  tls: starttls
  username: ""
  # Sender, optionally as `Name <address>` (MAITY_SMTP_FROM), and where replies go (MAITY_SMTP_REPLY_TO).
  from: ""
  replyTo: ""
  # The Secret holding the SMTP password (MAITY_SMTP_PASSWORD). The password is never a value here.
  passwordSecret:
    existingSecret: ""
    key: smtp-password

migrate:
  # `maity-hub migrate` as a Helm hook Job before every install and upgrade;
  # the hub itself never migrates and refuses to serve an outdated schema.
  # Off: run the migration yourself before each upgrade.
  enabled: true
  # Retries for a database that is briefly unreachable during the upgrade.
  backoffLimit: 3
  # Seconds for all attempts together. Keep it under the --timeout of
  # `helm install/upgrade` (the README uses 10m): a Job that outlives Helm can
  # still migrate under the old pod after Helm reported the failure.
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# More environment variables for the hub and the migrate Job, in the usual
# `env` form (name/value or name/valueFrom).
extraEnv: []

# More volumes and mounts for the hub and the migrate Job, e.g. a database CA:
#   extraVolumes:
#     - name: db-ca
#       secret: {secretName: maity-hub-db-ca}
#   extraVolumeMounts:
#     - {name: db-ca, mountPath: /etc/maity/db-ca, readOnly: true}
extraVolumes: []
extraVolumeMounts: []

service:
  # ClusterIP behind the Ingress. NodePort or LoadBalancer put the hub's plain
  # HTTP port outside the cluster: only with TLS in front of it.
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  # The IngressClass of the controller in front of the hub.
  className: ""
  # The host name browsers and agents use, e.g. maity.example.org.
  host: ""
  # Optional: a second host name that serves only the agent join, e.g.
  # join.example.org (docs/api.md §1.1). It joins the Ingress rules and the TLS
  # certificate and sets MAITY_JOIN_URL to https://<joinHost>; the hub itself
  # routes between the two hosts, so the Ingress sends the whole host to it.
  joinHost: ""
  # The defaults are for ingress-nginx: an event long-poll holds its request
  # for up to 55 seconds and must reach the client unbuffered (docs/api.md §8).
  # Another controller needs its own equivalents (README.md, "Ingress
  # controllers"). They merge with yours; set a key to null to drop it. Add
  # e.g. `cert-manager.io/cluster-issuer: <issuer>` to have cert-manager fill
  # the TLS Secret.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  tls:
    enabled: true
    # Empty: <release fullname>-tls.
    secretName: ""

networkPolicy:
  # Only the peers below and this release's `helm test` pod may connect to the
  # hub. The hub trusts X-Forwarded-For from the whole trusted-proxy range;
  # without the policy any pod could reach it and claim any client address.
  # Needs a CNI that enforces NetworkPolicy.
  enabled: true
  # NetworkPolicy peers (`from` entries). The default is the namespace of an
  # ingress controller installed as `ingress-nginx`; change it to yours, and
  # add the namespaces of in-cluster clients of a hub without an Ingress.
  # Traffic that arrives from a node address matches no namespace: with a
  # NodePort or LoadBalancer Service, or a controller on hostNetwork, the
  # default leaves the hub unreachable. Add an `ipBlock` with the nodes'
  # addresses, or disable the policy and restrict access another way.
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# A long-poll may still be open for up to 55 seconds when the pod is asked to
# stop; the hub finishes open requests before it exits.
terminationGracePeriodSeconds: 65

# Each block is rendered into its probe as it is.
probes:
  # /api/v1/health answers 503 while the database is unreachable or not at the
  # migration head: the pod then gets no traffic, but is not restarted.
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # /api/v1/help needs no database: it tells whether the process still answers.
  liveness:
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # The same endpoint until the process first answers: up to 60 seconds.
  startup:
    periodSeconds: 2
    timeoutSeconds: 5
    failureThreshold: 30

serviceAccount:
  # A dedicated ServiceAccount without an API token; the hub never talks to
  # the Kubernetes API.
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
