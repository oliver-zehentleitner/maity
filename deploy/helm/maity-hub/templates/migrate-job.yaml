{{- if .Values.migrate.enabled }}
{{- include "maity-hub.validate" . -}}
# `maity-hub migrate` before every install and upgrade, before the Deployment
# changes: a hook Job, not an init container, so it runs once per release and
# never in parallel with itself. A failed Job fails the install or upgrade
# and the running hub is left as it was. The finished Job stays until the
# next upgrade replaces it, so its log can still be read.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "maity-hub.fullname" . }}-migrate
  labels:
    {{- include "maity-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "maity-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # The chart's ServiceAccount does not exist yet on the first install,
      # when this hook runs; the Job needs no API access either way.
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "maity-hub.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "maity-hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "maity-hub.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "maity-hub.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
