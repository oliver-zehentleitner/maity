{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "maity-hub.fullname" . }}
  labels:
    {{- include "maity-hub.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (default (dict) .Values.ingress.annotations) }}
  {{- with .Values.ingress.requestLimit }}
  {{- if .enabled }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" (toString (int .perSecond)) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-burst-multiplier" (toString (div (add (int .burst) (sub (int .perSecond) 1)) (int .perSecond))) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-connections" (toString (int .inFlight)) }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- with .Values.ingress.joinHost }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-tls" (include "maity-hub.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range compact (list .Values.ingress.host .Values.ingress.joinHost) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "maity-hub.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
