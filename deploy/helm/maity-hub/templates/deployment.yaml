{{- include "maity-hub.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maity-hub.fullname" . }}
  labels:
    {{- include "maity-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  # One pod by default, stopped before its successor starts: with SQLite or
  # a local attachment volume two pods would not share what they must. More
  # replicas (PostgreSQL, attachments off the volume; the hub refuses
  # otherwise) share wake-ups, nonces, limits and worker passes through the
  # database (hub/context/replicas.md), so they roll one at a time.
  replicas: {{ .Values.replicas }}
  strategy:
    {{- if gt (int .Values.replicas) 1 }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "maity-hub.hubSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maity-hub.hubSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "maity-hub.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "maity-hub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "maity-hub.podSecurityContext" . | nindent 8 }}
      containers:
        - name: hub
          image: {{ include "maity-hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: MAITY_BIND
              value: "0.0.0.0:8080"
            {{- with include "maity-hub.attachmentEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- include "maity-hub.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/help
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/help
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "maity-hub.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.attachments.existingClaim }}
            - name: attachments
              mountPath: {{ .Values.attachments.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.attachments.existingClaim }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ .Values.attachments.existingClaim | quote }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if gt (int .Values.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "maity-hub.hubSelectorLabels" . | nindent 14 }}
      {{- end }}
