# systemd drop-in for the runner user's slice (install-services.sh installs it as
# /etc/systemd/system/user-<uid>.slice.d/maity-runner-limits.conf). Everything the runner user runs sits in this slice:
# the runner services' jobs AND the rootless Docker with the database containers, which the unit's own CPUQuota does
# not reach. One cap for all of it, so CI can never take the whole machine (the first run of three services took the
# VirtualBox guest down within minutes): at most 4 of its 8 cores, a low CPU and I/O weight, 8 GB, no swap.
[Slice]
CPUQuota=400%
CPUWeight=20
IOWeight=20
MemoryMax=8G
MemorySwapMax=0
