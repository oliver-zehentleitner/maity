# Values for deploy/helm/maity-hub on this setup (release name "maity").
image:
  repository: ghcr.io/oliver-zehentleitner/maity-hub
  digest: sha256:<the image digest>     # a digest, not a tag
config:
  # k3s's pod network: Traefik's pods connect from here.
  trustedProxies: "10.42.0.0/16"
database:
  existingSecret: maity-hub-db           # key database-url (docs/install/README.md)
attachments:
  existingClaim: maity-attachments       # attachments.yaml; the files are backed up with the dump (backup.yaml)
ingress:
  enabled: true
  className: traefik
  host: maity.example.org
  # The chart's defaults are ingress-nginx annotations; Traefik ignores them.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: null
    nginx.ingress.kubernetes.io/proxy-send-timeout: null
    nginx.ingress.kubernetes.io/proxy-buffering: null
  tls:
    enabled: true
    secretName: maity-tls                # filled by cert.yaml's Certificate
networkPolicy:
  enabled: true
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
