# A daily pg_dump into its own volume, keeping the newest 14, and a tar of the attachment volume with the same time stamp, both encrypted with
# gpg to the public key in the Secret maity-backup-key (key backup.pub) and written 0600: maity-<ts>.dump.gpg, maity-<ts>.attachments.tar.gpg.
# The private key is never on the cluster. Without the Secret, or with a private key in it, the Job fails before it writes anything. The
# volume is on the same disk as the database: copy the backups off the instance too (docs/install/README.md, "Backups on this setup").
# With the Secret maity-backup-signing-key (key backup-signing.key, an OpenPGP private key without a passphrase), each encrypted file gets a
# detached signature next to it, <file>.sig, which a restore checks against the fingerprint the operator keeps. The signature carries the
# file's name (with its time stamp) as a signed notation, backup-file@maity, which the restore compares with the name it is given. Without
# that Secret the backups are written unsigned and the log says so; a key in it that cannot sign, that can also decrypt, or that is the
# encryption key itself fails the Job before it writes anything.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: maity-backups, namespace: maity}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: maity-pg-dump, namespace: maity}
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata: {labels: {app: maity-pg-dump}}   # admitted by postgres-netpol.yaml
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          # The attachment files belong to the hub's user (10001, directories 0700), which the dump's user (999) cannot read: a first
          # container of that user tars them and hands the time stamp on, so that the dump and the tar of one night belong together.
          initContainers:
            - name: attachments
              image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  k=/key/backup.pub
                  # Never a backup without encryption, and never a skipped one: a missing key fails the Job, visibly.
                  [ -s "$k" ] || { echo "backup failed: no public key: create the Secret maity-backup-key with backup.pub (docs/install/README.md, \"Backups on this setup\")" >&2; exit 1; }
                  g=$(mktemp -d)
                  kinds=$(gpg --batch --quiet --homedir "$g" --no-autostart --show-keys --with-colons "$k" | cut -d: -f1)
                  if echo "$kinds" | grep -qxE 'sec|ssb'; then echo "backup failed: maity-backup-key holds a private key: put only the public key into it, and keep the private key off the cluster" >&2; exit 1; fi
                  echo "$kinds" | grep -qx pub || { echo "backup failed: maity-backup-key's backup.pub is not an OpenPGP public key" >&2; exit 1; }
                  # The signing key is optional (the dump container's log warns without it); one that is there must sign.
                  s=/signing/backup-signing.key
                  if [ -s "$s" ]; then
                    gpg --batch --quiet --homedir "$g" --import "$s" || { echo "backup failed: maity-backup-signing-key could not be imported" >&2; exit 1; }
                    echo | gpg --batch --quiet --homedir "$g" --pinentry-mode loopback --passphrase "" --detach-sign > /dev/null \
                      || { echo "backup failed: maity-backup-signing-key cannot sign: it needs an OpenPGP private key that signs, without a passphrase" >&2; exit 1; }
                    # A key of its own: one that can also decrypt, or the encryption key itself, is refused.
                    gpg --batch --homedir "$g" --with-colons --list-secret-keys > "$g/signing"
                    if awk -F: '($1 == "sec" || $1 == "ssb") && $12 ~ /[eE]/ {found = 1} END {exit !found}' "$g/signing"; then
                      echo "backup failed: maity-backup-signing-key can also decrypt: use a key that only signs, not the one in maity-backup-key" >&2; exit 1
                    fi
                    gpg --batch --quiet --homedir "$g" --no-autostart --show-keys --with-colons "$k" | awk -F: '$1 == "fpr" {print $10}' > "$g/recipient"
                    if awk -F: '$1 == "fpr" {print $10}' "$g/signing" | grep -qxFf "$g/recipient"; then
                      echo "backup failed: maity-backup-signing-key is the key in maity-backup-key: use a key of its own for signing" >&2; exit 1
                    fi
                  fi
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  t=/backups/maity-$ts.attachments.tar.gpg
                  trap 'rm -f "$t.part" "$t.sig.part"; gpgconf --homedir "$g" --kill gpg-agent 2>/dev/null || :' EXIT
                  # The backup volume's size is not enforced (local-path): it is the node's disk, which Postgres is on. A tar that would
                  # not fit twice (this night's and room to rotate) fails the Job before it writes, instead of filling the disk.
                  need=$(du -sk /attachments | cut -f1)
                  avail=$(df -Pk /backups | awk 'NR==2 {print $4}')
                  [ "$avail" -gt $((need * 2 + 1048576)) ] || { echo "not enough room for the attachment tar: need about $((need / 1024)) MiB, $((avail / 1024)) MiB free" >&2; exit 1; }
                  # tar exits 1 when a file changed or vanished while it was read (an upload that finished meanwhile): that is no failure.
                  # sh has no pipefail: a failure before gpg leaves a mark, gpg's own failure ends the pipe and the script. dd counts
                  # the plain bytes, which the encrypted file no longer shows.
                  { tar -cf - -C /attachments . || [ "$?" = 1 ] || touch "$g/failed"; } | LC_ALL=C dd bs=64k 2>"$g/count" \
                    | gpg --batch --quiet --homedir "$g" --no-autostart --trust-model always --recipient-file "$k" --compress-algo none --yes --encrypt --output "$t.part"
                  [ ! -e "$g/failed" ]
                  plain=$(awk '/ bytes / {print $1}' "$g/count")
                  [ "${plain:-0}" -gt 0 ]
                  # The signature covers the encrypted file, so a copy can be checked without the private decryption key.
                  [ ! -s "$s" ] || gpg --batch --quiet --homedir "$g" --pinentry-mode loopback --passphrase "" --yes \
                    --sig-notation "backup-file@maity=${t##*/}" --detach-sign --output "$t.sig.part" "$t.part"
                  mv "$t.part" "$t"
                  [ ! -s "$s" ] || mv "$t.sig.part" "$t.sig"
                  printf '%s %s\n' "$ts" "$plain" > /ts/stamp
              securityContext: {runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: b, mountPath: /backups}
                - {name: a, mountPath: /attachments, readOnly: true}
                - {name: ts, mountPath: /ts}
                - {name: key, mountPath: /key, readOnly: true}
                - {name: signing, mountPath: /signing, readOnly: true}
          containers:
            - name: dump
              image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: maity-postgres, key: password}}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  k=/key/backup.pub
                  read -r ts tplain < /ts/stamp
                  f=/backups/maity-$ts.dump.gpg
                  t=/backups/maity-$ts.attachments.tar.gpg
                  g=$(mktemp -d)
                  # One command per line: under `sh -e` a failure inside `a && b` does not stop the script, and
                  # the Job then reported success for a dump that never happened (an empty .part and "Complete").
                  trap 'rm -f "$f.part" "$f.sig.part"; gpgconf --homedir "$g" --kill gpg-agent 2>/dev/null || :' EXIT
                  s=/signing/backup-signing.key
                  signed="unsigned"
                  if [ -s "$s" ]; then
                    gpg --batch --quiet --homedir "$g" --import "$s" || { echo "backup failed: maity-backup-signing-key could not be imported" >&2; exit 1; }
                    echo | gpg --batch --quiet --homedir "$g" --pinentry-mode loopback --passphrase "" --detach-sign > /dev/null \
                      || { echo "backup failed: maity-backup-signing-key cannot sign: it needs an OpenPGP private key that signs, without a passphrase" >&2; exit 1; }
                    # A key of its own: one that can also decrypt, or the encryption key itself, is refused.
                    gpg --batch --homedir "$g" --with-colons --list-secret-keys > "$g/signing"
                    if awk -F: '($1 == "sec" || $1 == "ssb") && $12 ~ /[eE]/ {found = 1} END {exit !found}' "$g/signing"; then
                      echo "backup failed: maity-backup-signing-key can also decrypt: use a key that only signs, not the one in maity-backup-key" >&2; exit 1
                    fi
                    gpg --batch --quiet --homedir "$g" --no-autostart --show-keys --with-colons "$k" | awk -F: '$1 == "fpr" {print $10}' > "$g/recipient"
                    if awk -F: '$1 == "fpr" {print $10}' "$g/signing" | grep -qxFf "$g/recipient"; then
                      echo "backup failed: maity-backup-signing-key is the key in maity-backup-key: use a key of its own for signing" >&2; exit 1
                    fi
                    fpr=$(gpg --batch --homedir "$g" --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
                    signed="signed by $fpr"
                    test -s "$t.sig"
                  else
                    echo "warning: the backups are not signed: create the Secret maity-backup-signing-key (docs/install/README.md, \"Backups on this setup\")"
                  fi
                  # A few tries: a dump pod that starts before its network is ready got "Connection refused" while the database was fine.
                  # pg_dump writes to the pipe, so nothing unencrypted reaches the disk; its failure leaves a mark (sh has no pipefail).
                  n=0
                  while :; do
                    rm -f "$g/failed"
                    { pg_dump -h maity-postgres -U maity -Fc maity || touch "$g/failed"; } | LC_ALL=C dd bs=64k 2>"$g/count" \
                      | gpg --batch --quiet --homedir "$g" --no-autostart --trust-model always --recipient-file "$k" --compress-algo none --yes --encrypt --output "$f.part"
                    [ -e "$g/failed" ] || break
                    n=$((n + 1))
                    [ "$n" -lt 5 ] || exit 1
                    sleep 5
                  done
                  plain=$(awk '/ bytes / {print $1}' "$g/count")
                  [ "${plain:-0}" -gt 0 ]
                  [ ! -s "$s" ] || gpg --batch --quiet --homedir "$g" --pinentry-mode loopback --passphrase "" --yes \
                    --sig-notation "backup-file@maity=${f##*/}" --detach-sign --output "$f.sig.part" "$f.part"
                  mv "$f.part" "$f"
                  [ ! -s "$s" ] || mv "$f.sig.part" "$f.sig"
                  test -s "$t"
                  find /backups -name 'maity-*.part' -mmin +60 -delete
                  ls -1t /backups/maity-*.dump.gpg | tail -n +15 | xargs -r rm --
                  # a tar goes with its dump
                  for x in /backups/maity-*.attachments.tar.gpg; do [ -e "${x%.attachments.tar.gpg}.dump.gpg" ] || rm -f -- "$x"; done
                  # a signature goes with its file
                  for x in /backups/maity-*.gpg.sig; do [ -e "${x%.sig}" ] || rm -f -- "$x"; done
                  # Unencrypted backups from before encryption are left alone, and named every night until they are gone.
                  old=$(find /backups -maxdepth 1 \( -name 'maity-*.dump' -o -name 'maity-*.attachments.tar' \) | wc -l)
                  [ "$old" = 0 ] || echo "note: $old unencrypted backups from before encryption are still in /backups; copy off what you need, then delete them"
                  ls -l /backups
                  echo "dump ok: $f $(stat -c %s "$f") attachments $(stat -c %s "$t") (encrypted, $signed; plain bytes: dump $plain, attachments $tplain)"
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: b, mountPath: /backups}
                - {name: ts, mountPath: /ts, readOnly: true}
                - {name: key, mountPath: /key, readOnly: true}
                - {name: signing, mountPath: /signing, readOnly: true}
          volumes:
            - {name: b, persistentVolumeClaim: {claimName: maity-backups}}
            - {name: a, persistentVolumeClaim: {claimName: maity-attachments, readOnly: true}}
            - {name: ts, emptyDir: {sizeLimit: 1Mi}}
            # optional: without it the pod would wait forever for the Secret; the scripts check for the key and fail the Job instead
            - {name: key, secret: {secretName: maity-backup-key, optional: true, items: [{key: backup.pub, path: backup.pub}]}}
            # optional too: without it the backups are unsigned, with a warning. 0440: readable by the group fsGroup gives both containers.
            - {name: signing, secret: {secretName: maity-backup-signing-key, optional: true, defaultMode: 0440, items: [{key: backup-signing.key, path: backup-signing.key}]}}
