# Puts the attachment files of one night back (docs/install/README.md, "Backups on this setup"). The backups are encrypted to a key that is
# not on the cluster, so the tar is decrypted and checked where the private key is, and streamed into this Job's pod, which waits for it.
# It REPLACES everything in the attachment volume with the contents of that tar, so that the files match the restored database. Scale the
# hub to 0 first (the install guide's step 1). Right before it empties the volume, the Job checks through the Kubernetes API that the hub's
# Deployment wants 0 replicas and that none of its pods is left (terminating ones included); otherwise it stops with the volume unchanged.
# For that it has a ServiceAccount of its own whose Role reads only the hub's Deployment and lists the namespace's pods. The image is the
# hub's own (it has Python for that check, tar and sha256sum): put the digest from hub-values.yaml in place of <the image digest>. The
# release is "maity"; for another one change HUB_DEPLOYMENT, HUB_SELECTOR and the Role's resourceNames.
# Run this as one block with GNU tar, with the kube context of this instance as the first argument: every kubectl names it, so a shell
# whose current context points at another cluster cannot send the tar there. `sh -eu` stops at the first command that fails, so the
# hub found running, a decryption that fails, a tar that tar cannot read without an error, or one that does not end with its
# end-of-archive block (cut off, even between two files) never reaches the cluster. tar's listing goes to a file, not a pipe, since sh
# has no pipefail. The exec passes the tar's SHA-256; the pod keeps the stream in a scratch volume first and empties the attachment
# volume only when what arrived has that digest, so a stream cut off on the way leaves the volume as it is.
# With MAITY_BACKUP_SIGNER set to the backup signing key's fingerprint (docs/install/README.md, "Backups on this setup"), the block first
# checks <file>.sig and stops before decrypting when it is missing, holds more than one signature, does not verify, is by another key or
# a revoked or expired one, or was made for another file name (the signed notation backup-file@maity, which holds the time stamp); unset,
# it says so and goes on.
#   sh -eu -c '
#     ctx=$1
#     k() { kubectl --context "$ctx" -n maity "$@"; }
#     want=$(k get deploy maity-maity-hub -o jsonpath="{.spec.replicas}")   # an assignment: a failed kubectl stops here
#     pods=$(k get pods -l app.kubernetes.io/instance=maity,app.kubernetes.io/component=hub -o name)
#     [ "$want" = 0 ] || { echo "scale the hub to 0 first" >&2; exit 1; }
#     [ -z "$pods" ] || { echo "the hub still has pods: $pods" >&2; exit 1; }
#     signer=$(printf "%s" "${MAITY_BACKUP_SIGNER:-}" | tr -d " " | tr abcdef ABCDEF)   # the signing key's fingerprint, if set
#     if [ -n "$signer" ]; then
#       printf "%s\n" "$signer" | grep -qxE "[0-9A-F]{40}|[0-9A-F]{64}" || { echo "MAITY_BACKUP_SIGNER is not a fingerprint" >&2; exit 1; }
#       st=$(gpg --batch --status-fd 1 --verify "$2.sig" "$2")   # an assignment: a missing or bad signature stops here
#       [ "$(printf "%s\n" "$st" | grep -c "^\[GNUPG:\] NEWSIG")" = 1 ] || { echo "$2.sig holds more than one signature: the backup Job writes one" >&2; exit 1; }
#       printf "%s\n" "$st" | grep -qE "^\[GNUPG:\] VALIDSIG ($signer .*|.* $signer)$" || { echo "$2 is not signed by $signer" >&2; exit 1; }
#       ! printf "%s\n" "$st" | grep -qE "^\[GNUPG:\] (REVKEYSIG|KEYREVOKED|EXPKEYSIG)( |$)" || { echo "$2: the signing key is revoked or expired" >&2; exit 1; }
#       printf "%s\n" "$st" | grep -A2 -xF "[GNUPG:] NOTATION_NAME backup-file@maity" | grep -qxF "[GNUPG:] NOTATION_DATA ${2##*/}" \
#         || { echo "$2 was signed under another name: give it the name the backup Job wrote" >&2; exit 1; }   # the time stamp is signed too
#     else
#       echo "MAITY_BACKUP_SIGNER is not set: the signature is not checked" >&2
#     fi
#     gpg -d "$2" > attachments.tar
#     LC_ALL=C tar -tRf attachments.tar > attachments.list   # read the whole tar: any error stops here
#     tail -n 1 attachments.list | grep -q "Block of NULs"   # and it reached the end-of-archive block
#     sum=$(sha256sum < attachments.tar | cut -c1-64)
#     kubectl --context "$ctx" apply -f deploy/k3s-single/restore-attachments.yaml
#     k wait --for=create pod -l job-name=restore-attachments --timeout=60s || sleep 10   # 1.33+; older returns at once
#     k wait --for=condition=ready pod -l job-name=restore-attachments --timeout=120s
#     k exec -i job/restore-attachments -- sh /tmp/restore "$sum" < attachments.tar
#     k wait --for=condition=complete job/restore-attachments --timeout=120s
#     kubectl --context "$ctx" delete -f deploy/k3s-single/restore-attachments.yaml
#     rm attachments.tar attachments.list
#   ' restore <kube context> maity-<time stamp>.attachments.tar.gpg
# A failed step stops the block where it is and keeps attachments.tar and attachments.list. A stream that arrives incomplete fails the
# exec with the volume unchanged: run the exec line again with the same digest. A hub found running fails the exec the same way: scale
# it to 0, wait for its pods to go, and run the exec line again. Nothing streamed within an hour ends the Job as failed, with the volume
# unchanged. The scratch volume is on the node's disk and holds one copy of the tar while the restore runs. The block ends by deleting
# everything this file creates (the Job, the ServiceAccount, the Role and its binding).
apiVersion: v1
kind: ServiceAccount
metadata: {name: restore-attachments, namespace: maity}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: restore-attachments, namespace: maity}
rules:
  - {apiGroups: [apps], resources: [deployments], resourceNames: [maity-maity-hub], verbs: [get]}
  - {apiGroups: [""], resources: [pods], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: restore-attachments, namespace: maity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: restore-attachments}
subjects: [{kind: ServiceAccount, name: restore-attachments, namespace: maity}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: restore-attachments, namespace: maity}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: restore-attachments
      automountServiceAccountToken: true   # only this pod gets the token: the check below reads the API with it
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: restore
          image: ghcr.io/oliver-zehentleitner/maity-hub@sha256:<the image digest>   # the digest from hub-values.yaml
          command: ["/bin/sh", "-ec"]
          env:
            - {name: HUB_DEPLOYMENT, value: maity-maity-hub}
            - {name: HUB_SELECTOR, value: "app.kubernetes.io/instance=maity,app.kubernetes.io/component=hub"}
          args:
            - |
              # The check the script below runs right before it empties the volume: exit 0 only when the hub's Deployment wants 0
              # replicas and no pod of it is left. Any error (no such Deployment, no access, no answer) is a refusal, not a pass.
              cat > /tmp/hub-stopped.py <<'PY'
              import json, os, ssl, sys, urllib.parse, urllib.request
              sa = "/var/run/secrets/kubernetes.io/serviceaccount"
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              base = "https://%s:%s" % ("[%s]" % host if ":" in host else host, os.environ["KUBERNETES_SERVICE_PORT"])
              ns = open(sa + "/namespace").read().strip()
              headers = {"Authorization": "Bearer " + open(sa + "/token").read().strip()}
              tls = ssl.create_default_context(cafile=sa + "/ca.crt")
              def get(path):
                  with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), context=tls, timeout=10) as r:
                      return json.load(r)
              try:
                  want = get("/apis/apps/v1/namespaces/%s/deployments/%s" % (ns, os.environ["HUB_DEPLOYMENT"]))["spec"].get("replicas", 1)
                  pods = get("/api/v1/namespaces/%s/pods?labelSelector=%s" % (ns, urllib.parse.quote(os.environ["HUB_SELECTOR"], safe="")))["items"]
              except Exception as e:
                  sys.exit("could not check that the hub is stopped (%s): the volume is unchanged" % e)
              if want != 0 or pods:
                  sys.exit("the hub is not stopped (%s wants %s replica(s), %d pod(s) left): scale it to 0, wait for its pods to go, "
                           "and run the exec again; the volume is unchanged" % (os.environ["HUB_DEPLOYMENT"], want, len(pods)))
              PY
              # The script the exec runs, reading the decrypted tar from its stdin.
              cat > /tmp/restore <<'EOF'
              set -e
              # $1 is the SHA-256 of the tar that was checked where it was decrypted. The stream goes to the scratch volume first:
              # anything but exactly that tar (cut off, empty, no digest given) leaves the attachment volume as it is.
              cat > /staging/attachments.tar
              if [ -z "${1:-}" ] || [ "$(sha256sum < /staging/attachments.tar | cut -c1-64)" != "$1" ]; then
                rm -f /staging/attachments.tar
                echo "the tar did not arrive whole (its SHA-256 differs): the volume is unchanged" >&2; exit 1
              fi
              # Only now, with the tar whole in the scratch volume, and right before the volume is emptied: the hub must be stopped.
              python3 /tmp/hub-stopped.py || { rm -f /staging/attachments.tar; exit 1; }
              find /attachments -mindepth 1 -delete
              # --strip-components=1 skips the "./" entry: the root of the volume is the provisioner's (root, 0777), not ours, and
              # tar would fail on setting its time and mode (exit 2) after the files were already back. A volume with a lost+found
              # (root, 0700) would also fail here and in the nightly tar: that is not the case on k3s's local-path.
              tar -xf /staging/attachments.tar -C /attachments --strip-components=1
              rm /staging/attachments.tar
              touch /tmp/done
              echo "restored into /attachments"
              EOF
              until [ -e /tmp/done ]; do sleep 2; done
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: a, mountPath: /attachments}
            - {name: staging, mountPath: /staging}
      volumes:
        - {name: a, persistentVolumeClaim: {claimName: maity-attachments}}
        - {name: staging, emptyDir: {}}
